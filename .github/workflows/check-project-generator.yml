name: Check Creative Studio

on:
  push:
    paths:
      - "scripts/**"
      - "templates/**"
      - "studio/**"
      - ".github/workflows/check-project-generator.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "templates/**"
      - "studio/**"
      - ".github/workflows/check-project-generator.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Compile helper scripts
        run: |
          python -m py_compile scripts/new_project.py
          python -m py_compile scripts/check_studio.py
      - name: Check offline dashboard
        run: python scripts/check_studio.py
      - name: Create sample project
        run: |
          python scripts/new_project.py "CI Sample Project" --type video --output /tmp/creative-studio-check
          test -f "/tmp/creative-studio-check/ci-sample-project/brief.md"
          test -f "/tmp/creative-studio-check/ci-sample-project/README.md"
