name: Deploy AI Creative Studio to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "site/**"
      - "studio/**"
      - "examples/mini-game/index.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare website
        run: |
          mkdir -p site/studio site/game
          cp studio/index.html site/studio/index.html
          cp studio/storyboard.html site/studio/storyboard.html
          cp studio/animation.html site/studio/animation.html
          cp examples/mini-game/index.html site/game/index.html
          test -s site/index.html
          test -s site/studio/index.html
          test -s site/studio/storyboard.html
          test -s site/studio/animation.html
          test -s site/game/index.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
